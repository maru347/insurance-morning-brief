name: 보험 아침 브리핑

on:
  schedule:
    - cron: "30 23 * * *"   # UTC 23:30 = 한국시간 08:30 (매일)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼
    inputs:
      mode:
        description: "실행 방식 (full = 전체 실행·Claude 비용 발생 / kakao-test = 최근 브리핑 카톡 재전송·무료)"
        type: choice
        options: [full, kakao-test]
        default: full

permissions:
  contents: write            # docs/ 폴더에 브리핑 페이지를 커밋하기 위해

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 브리핑 생성 및 전송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python main.py ${{ github.event.inputs.mode == 'kakao-test' && '--kakao-test' || '' }}
      - name: 브리핑 페이지 커밋
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "brief: $(TZ=Asia/Seoul date +%F)"
          git push
